spring.application.name=momentum

# Server Port (defaults to 8080, supports cloud-provided $PORT)
server.port=${PORT:8080}

# Database Configuration:
# Defaults to file-based persistent H2 database (MySQL compatibility mode) so users, habits, and streaks survive server restarts.
# When SPRING_DATASOURCE_URL is provided, it automatically connects to cloud MySQL!
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/momentumdb;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE;AUTO_SERVER=TRUE}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:org.h2.Driver}

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Explicit Hibernate Dialect so Hibernate never fails Dialect metadata detection
spring.jpa.database-platform=${JPA_DATABASE_PLATFORM:org.hibernate.dialect.H2Dialect}
spring.jpa.properties.hibernate.dialect=${HIBERNATE_DIALECT:org.hibernate.dialect.H2Dialect}
spring.jpa.properties.jakarta.persistence.jdbc.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/momentumdb;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE;AUTO_SERVER=TRUE}

# JWT Configuration (default 7 days: 604800000 ms)
jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
jwt.expiration-ms=${JWT_EXPIRATION_MS:604800000}
