spring.application.name=momentum

# Server Port (defaults to 8080, supports cloud-provided $PORT)
server.port=${PORT:8080}

# Database Configuration:
# Defaults to in-memory H2 database (MySQL compatibility mode) for instant cloud deployment.
# When SPRING_DATASOURCE_URL is provided, it automatically connects to cloud MySQL!
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:momentumdb;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# JWT Configuration
jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
